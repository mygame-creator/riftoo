name: Build Rift Lite APK

on:
  push:
    branches: [ main, master ]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: 'npm'

      - name: Install dependencies
        run: npm install

      - name: Sync Capacitor
        run: npx cap sync android

      - name: Build Android APK
        uses: pmmao/android-build-action@v1
        with:
          project-dir: android
          build-type: debug

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: rift-lite-apk
          path: android/app/build/outputs/apk/debug/*.apk
