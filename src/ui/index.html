<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta http-equiv="Content-Security-Policy" content="default-src 'self'; img-src 'self' https: http: data:; style-src 'self' 'unsafe-inline'">
  <title>Rift</title>
  <link rel="stylesheet" href="base.css">
  <link rel="stylesheet" href="shell.css">
</head>
<body>
  <aside id="side">
    <button id="logo" title="New tab" aria-label="New tab"></button>
    <nav id="apps" aria-label="Sidebar apps"></nav>
    <div class="spacer"></div>
    <nav id="bottom"></nav>
  </aside>
  <header id="top">
    <div id="tabs" role="tablist"></div>
    <div id="bar">
      <button class="nb" id="back" data-icon="back" title="Back" aria-label="Back"></button>
      <button class="nb" id="fwd" data-icon="fwd" title="Forward" aria-label="Forward"></button>
      <button class="nb" id="reload" data-icon="reload" title="Reload" aria-label="Reload"></button>
      <input id="url" type="text" spellcheck="false" autocomplete="off" placeholder="Search or enter address" aria-label="Address bar">
      <button class="nb" id="star" data-icon="star" title="Bookmark this page" aria-label="Bookmark this page"></button>
    </div>
  </header>
  <iframe id="main-webview" src="about:blank" style="position:absolute; top:84px; left:60px; right:0; bottom:0; border:none; background:black;"></iframe>
  <script src="mobile-bridge.js"></script>
  <script src="shell.js"></script>
  <script src="theme.js"></script>
</body>
</html>
